<!DOCTYPE html>
<html lang="{{ copy.html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ copy.title }} - {{ app_name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 0;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>{{ copy.heading }}</h2>

    <p>{{ copy.hello }}</p>

    <p>{{ copy.body }}</p>

    <p>{{ copy.prompt }}</p>

    <p>
        <a href="{{ verification_url }}" class="button">
            {{ copy.button }}
        </a>
    </p>

    <p>{{ copy.or_copy }}</p>
    <p><a href="{{ verification_url }}">{{ verification_url }}</a></p>

    <p>{{ copy.ignore }}</p>

    <div class="footer">
        <p>{{ copy.closing }}<br>{{ copy.team }}</p>
    </div>
</body>
</html>
